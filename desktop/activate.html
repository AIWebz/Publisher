<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Folio Publisher</title>
<style>
  :root { --paper: #f4f0e8; --ink: #1d1f1e; --muted: #5d625f; --line: #cfc8ba; --field: #fffdf8; --accent: #1f43ad; --on-accent: #fff; --error: #b3261e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161a19; --ink: #ecebe6; --muted: #a3a8a4; --line: #3a403e; --field: #202524; --accent: #7d9bff; --on-accent: #0d1430; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; }
  form { margin: auto; width: 100%; padding: 32px 36px; display: grid; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); }
  label { font-weight: 600; font-size: 13px; }
  input { width: 100%; height: 44px; font-size: 16px !important; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .02em; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .error { color: var(--error); min-height: 1.5em; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="form" novalidate>
  <div class="brand"><img src="../app/icons/icon-512.png" alt=""><h1 data-s="title">Activate Folio Publisher</h1></div>
  <p data-s="intro">Enter the serial number you received with your purchase.</p>
  <p id="hint" hidden></p>
  <label for="serial" data-s="label">Serial number</label>
  <input id="serial" spellcheck="false" autocomplete="off" maxlength="40" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" aria-describedby="error">
  <div id="error" class="error" role="alert"></div>
  <div class="actions">
    <button type="button" id="quit" data-s="quit">Quit</button>
    <button type="submit" id="go" class="primary" data-s="activate">Activate</button>
  </div>
</form>
<script src="activate-page.js"></script>
</body>
</html>

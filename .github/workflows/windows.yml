name: Build Windows app

on:
  push:
    branches: [main, claude/blissful-cerf-h12c9e]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Publisher-Windows-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Folio Publisher ${{ steps.version.outputs.version }}
          make_latest: true
          files: dist/*.exe
          body: |
            **Folio Publisher for Windows 10 and 11 (64-bit)**

            Download `Folio-Publisher-Setup-${{ steps.version.outputs.version }}.exe` below and run it.

            The installer is not code-signed, so Windows SmartScreen may show "Windows protected your PC".
            Choose **More info → Run anyway** to continue.

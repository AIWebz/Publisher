name: Build desktop apps

# Builds the Windows installer and the macOS disk images on every push, and publishes them as a
# GitHub release when a version tag (v<package.json version>) is pushed — or when the workflow is
# run by hand with "Publish release" ticked, which tags the chosen commit as v<package.json version>.

on:
  push:
    branches: [main, claude/blissful-cerf-h12c9e]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<package.json version>) from this commit'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win --x64
            files: |
              dist/*.exe
          - name: macOS
            os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
              dist/*.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          EXPECTED: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED). Bump the version or re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the app bundle
        run: npm run build

      - name: Package (${{ matrix.name }})
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Developer ID / Authenticode certificate: Windows is unsigned, macOS is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Publisher-${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED)."
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: Folio-Publisher-*
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          ls -la
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Folio Publisher ${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            ## Folio Publisher ${{ steps.version.outputs.version }}

            | Download | For |
            | --- | --- |
            | `Folio-Publisher-Setup-${{ steps.version.outputs.version }}.exe` | Windows 10 and 11 (64-bit) |
            | `Folio-Publisher-${{ steps.version.outputs.version }}-mac-arm64.dmg` | Mac with Apple silicon (M1 or later), macOS 13 or later |
            | `Folio-Publisher-${{ steps.version.outputs.version }}-mac-x64.dmg` | Mac with an Intel processor, macOS 13 or later |

            The `.zip` files contain the same Mac app without the disk image. `SHA256SUMS.txt` lists checksums.

            **Windows:** the installer is not code-signed, so SmartScreen may say *"Windows protected your PC"*.
            Choose **More info → Run anyway**.

            **macOS:** the app is not notarized by Apple. Open the disk image, drag **Folio Publisher** to
            **Applications**, then open it. If macOS says it cannot verify the developer, open
            **System Settings → Privacy & Security** and click **Open Anyway** (on macOS 14 and earlier you can
            also Control-click the app and choose **Open**). You only need to do this once.

name: Build desktop apps

# Builds the Windows installer and the macOS disk images on every push, and publishes them as a
# GitHub release when a version tag (v<package.json version>) is pushed — or when the workflow is
# run by hand with "Publish release" ticked, which tags the chosen commit as v<package.json version>.

on:
  push:
    branches: [main, claude/blissful-cerf-h12c9e]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers on the download website (GitHub Pages) and remove installers from GitHub Releases'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win --x64
            files: |
              dist/*.exe
          - name: macOS
            os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          EXPECTED: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED). Bump the version or re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the app bundle
        run: npm run build

      - name: Package (${{ matrix.name }})
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Developer ID / Authenticode certificate: Windows is unsigned, macOS is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Publisher-${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  website:
    name: Download website
    needs: build
    # every push to the release branch republishes the site (a branch-built GitHub Pages site would otherwise replace it)
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/claude/blissful-cerf-h12c9e')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: _site/downloads
          pattern: Folio-Publisher-*
          merge-multiple: true

      - name: Assemble the site
        run: |
          cp -r site/. _site/
          node scripts/site-manifest.mjs _site/downloads "$(node -p "require('./package.json').version")"
          ls -la _site _site/downloads
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy website
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  remove-releases:
    name: Remove installers from GitHub Releases
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
